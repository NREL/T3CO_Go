[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "t3co_go_django"
version = "0.1.0"
dynamic = ["dependencies"]
description = "Django application for visualizing Total Cost of Ownership (TCO) analyses"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
  {name = "Harish Panneer Selvam", email = "harish.panneerselvam@nrel.gov"},
]
maintainers = [{name = "NREL-AVCI", email = "t3co@nrel.gov"}]
keywords = ["tco", "vehicle-cost", "total-cost", "vehicle-simulation", "total-cost-of-ownership", "django"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: BSD License",
  "Framework :: Django",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.9,<3.11"

[tool.poetry.dependencies]
python = ">=3.9,!=3.9.7,<3.11"
django = "^4.0"
numpy = "^1.24"
scipy = "^1.10.1"
pandas = "^2.0.3"
djangorestframework = "^3.14"
streamlit = "^1.41"

[project.urls]
Homepage = "https://www.nrel.gov/transportation/t3co.html"
Documentation = "https://nrel.github.io/T3CO_Go/"
Repository = "https://github.com/NREL/t3co_go"
"Bug Tracker" = "https://github.com/NREL/t3co_go/issues"

[project.scripts]
runserver = "t3co_go_django.manage:main"