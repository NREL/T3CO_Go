version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./media:/app/media
      - ./demo_inputs:/app/demo_inputs
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: t3co_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

volumes:
  postgres_data: