<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCO Analysis</title>
    <link rel="stylesheet" href="{% static 't3co_app/css/style.css' %}">
</head>
<body>
    {% include 't3co_app/base.html' %}
    
    <div class="container">
        <h1>Total Cost of Ownership Analysis</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label for="vehicle_file">Upload Vehicle Input File:</label>
                <input type="file" name="vehicle_file" id="vehicle_file" required>
            </div>
            <div class="form-group">
                <label for="scenario_file">Upload Scenario Input File:</label>
                <input type="file" name="scenario_file" id="scenario_file" required>
            </div>
            <button type="submit" class="btn btn-primary">Analyze</button>
        </form>

        {% if results %}
            <h2>Analysis Results</h2>
            <div class="results">
                <pre>{{ results }}</pre>
            </div>
        {% endif %}
    </div>

    <script src="{% static 't3co_app/js/main.js' %}"></script>
</body>
</html>
